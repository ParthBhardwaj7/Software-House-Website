name: 🚀 Build, Push & Deploy

# Triggers on every push to main, or manually from GitHub Actions UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Required so this job can push Docker images to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # ─────────────────────────────────────────────────────
      # 1. Source code
      # ─────────────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────
      # 2. Docker setup
      # ─────────────────────────────────────────────────────
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-provided — no extra secret needed for push
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔡 Lowercase image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────
      # 3. Build + push API image
      #    Separate cache scope so API and web layer caches don't collide
      # ─────────────────────────────────────────────────────
      - name: 🔨 Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/software-house-api:latest
            ghcr.io/${{ env.OWNER }}/software-house-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ─────────────────────────────────────────────────────
      # 4. Resolve NEXT_PUBLIC_* for web build
      #    Admin login + client fetch use NEXT_PUBLIC_API_URL (must NOT be empty — else bundle
      #    falls back to localhost:3001). If only SITE_URL is set, derive API as SITE + /api.
      # ─────────────────────────────────────────────────────
      - name: Resolve NEXT_PUBLIC_* for web Docker build
        env:
          SITE: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          API: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          API_URL="$API"
          SITE_URL="$SITE"
          if [ -z "$API_URL" ] && [ -n "$SITE_URL" ]; then
            API_URL="${SITE_URL%/}/api"
            echo "::notice::NEXT_PUBLIC_API_URL was empty — using ${API_URL} (SITE_URL + /api)"
          fi
          if [ -z "$API_URL" ]; then
            echo "::error::Set secret NEXT_PUBLIC_API_URL=https://apncodix.com/api OR NEXT_PUBLIC_SITE_URL=https://apncodix.com"
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            SITE_URL="${API_URL%/api}"
            SITE_URL="${SITE_URL%/}"
          fi
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────
      # 4b. Build + push Web image
      #    NEXT_PUBLIC_* vars are baked into the client bundle at this step.
      #    They are NOT runtime env vars — the .env on the server does nothing for them.
      # ─────────────────────────────────────────────────────
      - name: 🔨 Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/software-house-web:latest
            ghcr.io/${{ env.OWNER }}/software-house-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ─────────────────────────────────────────────────────
      # 4c. Make both GHCR packages public so the server can pull
      #     without credentials (manual docker compose pull works too)
      # ─────────────────────────────────────────────────────
      - name: 🌐 Make GHCR packages public
        run: |
          for PKG in software-house-api software-house-web; do
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${PKG}" \
              -d '{"visibility":"public"}' \
              | grep -E '"visibility"|"message"' || true
          done

      # ─────────────────────────────────────────────────────
      # 5. Deploy to DigitalOcean droplet
      #    Server only pulls pre-built images — never builds anything
      # ─────────────────────────────────────────────────────
      - name: 🚀 Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Pass GITHUB_TOKEN so the server can pull from GHCR during this run
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          # Full image URIs passed to docker-compose.prod.yml via environment
          API_IMAGE: ghcr.io/${{ env.OWNER }}/software-house-api:latest
          WEB_IMAGE: ghcr.io/${{ env.OWNER }}/software-house-web:latest
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,API_IMAGE,WEB_IMAGE
          command_timeout: 10m
          script: |
            set -e
            cd ~/Software-House-Website

            # Always sync server to match remote exactly — discard any local drift
            git fetch origin main
            git reset --hard origin/main

            # Authenticate with GHCR to pull private images
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull updated images (only downloads changed layers — fast)
            docker compose -f docker-compose.prod.yml pull

            # Restart containers with zero config
            # --remove-orphans removes containers for services no longer in compose file
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old dangling images to save disk space
            docker image prune -f

            echo "✅ Deployment successful!"
