name: 🚀 Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --no-optional

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: 🔨 Build API
        run: npm run build --workspace=api

      - name: 🔨 Build Web
        run: npm run build --workspace=web

      - name: 📦 Archive built artifacts
        run: tar -czf deploy.tar.gz apps/api/dist apps/web/.next

      - name: 📤 Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/root/Software-House-Website/"
          rm: true
          strip_components: 0
          command_timeout: 30m
          debug: true

      - name: 🔄 Apply Migrations & Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd ~/Software-House-Website

            # 1. Extract built files (overwrite old safely)
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # 2. Install prod dependencies only (fast & light)
            npm ci --production --no-optional

            # 3. Safe DB migration (never drops data)
            cd apps/api
            npx prisma migrate deploy
            npx prisma generate

            # 4. Restart API (fallback if not running)
            cd ../..
            pm2 restart api 2>/dev/null || pm2 start apps/api/dist/src/main.js --name api

            # 5. Restart Web
            pm2 restart web 2>/dev/null || pm2 start npm --name web --cwd apps/web -- run start

            pm2 save
            echo "✅ Deployment successful!"